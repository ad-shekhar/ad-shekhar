
name: Update GitHub Contributions

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution card
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.sax.saxutils import escape

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"login": "ad-shekhar"}
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          if data.get("errors") or not data.get("data", {}).get("user"):
              raise RuntimeError("GitHub GraphQL request failed")

          total = data["data"]["user"]["contributionsCollection"][
              "contributionCalendar"
          ]["totalContributions"]

          updated = datetime.now(timezone.utc).strftime(
              "%d %b %Y, %H:%M UTC"
          )

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="700" height="180" viewBox="0 0 700 180">
            <rect width="700" height="180" rx="18" fill="#0B1020"/>
            <rect x="1" y="1" width="698" height="178" rx="17"
                  fill="none" stroke="#123B5D"/>
            <text x="350" y="48" fill="#8B949E"
                  font-family="Arial" font-size="16"
                  text-anchor="middle" letter-spacing="3">
              ADITYA SHEKHAR · GITHUB TELEMETRY
            </text>
            <text x="350" y="112" fill="#00D4FF"
                  font-family="Arial" font-size="52"
                  font-weight="bold" text-anchor="middle">
              {total:,}
            </text>
            <text x="350" y="143" fill="#FFFFFF"
                  font-family="Arial" font-size="16"
                  text-anchor="middle">
              TOTAL CONTRIBUTIONS
            </text>
            <text x="350" y="166" fill="#8B949E"
                  font-family="Arial" font-size="10"
                  text-anchor="middle">
              Last updated: {escape(updated)}
            </text>
          </svg>'''

          path = Path("assets/total-contributions.svg")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(svg, encoding="utf-8")
          print(f"Updated contribution total: {total}")
          PY

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/total-contributions.svg
          git diff --cached --quiet || (
            git commit -m "chore: update GitHub contribution statistics"
            git push
          )

